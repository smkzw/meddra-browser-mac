<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedDRA Browser 便携版入口</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #2e221f;
      background: #faf5ef;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: radial-gradient(ellipse at 28% 8%, #fffaf1, transparent 62%), #f6ede4;
    }
    main {
      width: min(620px, 100%);
      padding: 26px;
      background: linear-gradient(168deg, #fff 0%, #fffdf9 47%, #faf3eb 100%);
      border: 1px solid #e6d6c8;
      border-radius: 15px;
      box-shadow: 0 1px 2px #64402a12, 0 8px 22px #64402a12, 0 20px 55px #64402a10;
    }
    header { display: flex; align-items: center; gap: 12px; }
    img { width: 42px; height: 42px; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 12px 0; line-height: 1.55; }
    .hint { color: #665347; }
    #status { padding: 12px; margin: 16px 0 10px; background: #f8eee4; border-radius: 8px; }
    #address { user-select: all; font-size: 14px; overflow-wrap: anywhere; }
    button {
      color: white;
      background: #a8391b;
      border: 1px solid #a8391b;
      border-radius: 7px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    button:focus-visible { outline: 3px solid #b6502d; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="frontend/dist/brand/app-icon-256.png" alt="">
      <h1>MedDRA Browser 便携版</h1>
    </header>
    <p id="launcher">完整解压后，双击与系统对应的第一步启动文件。</p>
    <p class="hint">启动后通常会自动打开工作台。使用期间保持启动窗口打开。</p>
    <p id="status" role="status">正在确认本文件夹的启动状态…</p>
    <button id="retry" type="button">重新检测</button>
    <p class="hint" id="manual" hidden>如果启动窗口仍显示下列地址，可复制到浏览器地址栏。<br><code id="address"></code></p>
    <noscript><p>在启动窗口复制本地服务地址，再粘贴到浏览器地址栏。</p></noscript>
  </main>
  <script>
    const status = document.querySelector("#status");
    const retry = document.querySelector("#retry");
    const manual = document.querySelector("#manual");
    const platform = navigator.userAgentData?.platform || navigator.platform;
    const system = /win/i.test(platform) ? "Windows" : /mac/i.test(platform) ? "Mac" : "";
    if (system) {
      const extension = system === "Mac" ? "command" : "bat";
      document.querySelector("#launcher").textContent =
        `完整解压后，双击「【${system}】第一步：请双击我运行.${extension}」。`;
    }

    function readSidecar() {
      return new Promise(resolve => {
        delete window.__MEDDRA_PORTABLE_RUNTIME;
        const script = document.createElement("script");
        const finish = () => {
          clearTimeout(timeout);
          script.remove();
          resolve(window.__MEDDRA_PORTABLE_RUNTIME);
        };
        const timeout = setTimeout(finish, 800);
        script.onload = script.onerror = finish;
        script.src = "portable-active-port.js?t=" + Date.now();
        document.head.append(script);
      });
    }

    async function detect() {
      retry.disabled = true;
      manual.hidden = true;
      status.textContent = "正在确认本文件夹的启动状态…";
      const info = await readSidecar();
      if (!info || info.distribution_mode !== "portable" ||
          !Number.isInteger(info.port) || info.port < 1 || info.port > 65535 ||
          !/^[a-f0-9]{32}$/.test(info.instance_id)) {
        status.textContent = "当前文件夹尚无可用地址。请运行第一步，待启动窗口显示地址后重新检测。";
        retry.disabled = false;
        return;
      }

      const url = `http://127.0.0.1:${info.port}/`;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 1800);
      try {
        const response = await fetch(url + "api/runtime-info", {
          cache: "no-store",
          credentials: "omit",
          signal: controller.signal,
        });
        const active = response.ok ? await response.json() : null;
        if (active?.distribution_mode === "portable" && active.instance_id === info.instance_id) {
          status.textContent = "本地服务已启动，正在打开工作台…";
          window.location.replace(url);
          return;
        }
        status.textContent = "当前地址已失效。请重新运行第一步。";
      } catch {
        status.textContent = "暂时无法确认服务。请查看启动窗口，或在启动完成后重新检测。";
        document.querySelector("#address").textContent = url;
        manual.hidden = false;
      } finally {
        clearTimeout(timeout);
        retry.disabled = false;
      }
    }

    retry.addEventListener("click", detect);
    detect();
  </script>
</body>
</html>
